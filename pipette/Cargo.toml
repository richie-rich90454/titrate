[package]
name = "pipette"
version = "0.2.0"
edition = "2021"
description = "Titrate build tool and package manager"

[dependencies]
trc = { path = "../trc" }

[profile.lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.pgo]
inherits = "release"
# Instrumentation and profile-use flags are supplied through RUSTFLAGS; see docs/guide/release-profiles.md.
