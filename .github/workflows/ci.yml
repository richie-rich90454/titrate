name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build, test, and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The inkwell backend links the LLVM C API directly, and llvm-sys is
      # pinned to LLVM 22.1. Runner images ship an older LLVM-C, which fails
      # to link with unresolved symbol errors. Install the matching release
      # and point the build script at it.
      - name: Install LLVM 22.1 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-win64.exe

      - name: Export Windows LLVM prefix
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LLVM_SYS_221_PREFIX=$env:LLVM_PATH" >> $env:GITHUB_ENV'

      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          src=$(find /usr/lib/llvm-22/lib -maxdepth 1 -name 'libLLVM*.so*' 2>/dev/null | head -n 1)
          if [ -z "$src" ]; then
            echo "No shared LLVM library in /usr/lib/llvm-22/lib" >&2
            exit 1
          fi
          sudo ln -sf "$src" /usr/lib/llvm-22/lib/libLLVM-C.so
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"

      - name: Build all crates
        run: cargo build --all --jobs 1

      # Native integration tests now detect LLVM and the runtime library at
      # runtime. Build the release library so they actually compile, link and
      # execute here instead of printing a skip warning.
      - name: Verify native codegen end to end
        run: |
          cargo build -p titrate_native --release --jobs 1
          cargo test --all --jobs 1

      # Report-only: native stdlib parity is known incomplete. Keep this visible
      # in CI without blocking the gate; see HANDOFF.md section 6 for status.
      - name: Native stdlib parity report (non-gating)
        continue-on-error: true
        run: cargo test -p trc --test stdlib_runtest --jobs 1 -- --ignored

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      # Screenshots are generated headlessly from real demo output. The check
      # keeps the committed PNG/SVG gallery honest without needing a browser.
      - name: Verify demo screenshots are current
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/capture_demos.ps1 -Check
