name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build, test, and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # No LLVM setup: trc/build.rs skips llvm-config and only links LLVM-C
      # when a prefix is supplied; otherwise the build uses its text-IR
      # fallback. The LLVM-native tests are #[ignore]d and are not run here.
      - name: Build all crates
        run: cargo build --all --jobs 1

      - name: Test all crates
        run: cargo test --all --jobs 1

      - name: Clippy
        run: cargo clippy --all -- -D warnings
