name: Nightly Native Stdlib Parity

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-stdlib-parity:
    name: Native stdlib parity report (nightly, non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # inkwell links the LLVM C API directly and llvm-sys is pinned to LLVM
      # 22.1, so the runner's default LLVM must be replaced before trc builds.
      - name: Install LLVM 22 (Linux)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          src=$(find /usr/lib/llvm-22/lib -maxdepth 1 -name 'libLLVM*.so*' 2>/dev/null | head -n 1)
          if [ -z "$src" ]; then
            echo "No shared LLVM library in /usr/lib/llvm-22/lib" >&2
            exit 1
          fi
          sudo ln -sf "$src" /usr/lib/llvm-22/lib/libLLVM-C.so
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"

      # The ignored parity test runs the trc binary and needs the debug native
      # library, so build both prerequisites explicitly (--jobs 1).
      - name: Build parity prerequisites
        run: |
          cargo build -p trc --jobs 1
          cargo build -p titrate_native --jobs 1

      # Native stdlib parity is known incomplete; report it without gating CI.
      - name: Native stdlib parity report (non-gating)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test -p trc --test stdlib_runtest stdlib_runtest_native --jobs 1 -- --ignored --exact 2>&1 | tee native-stdlib-parity.log

      - name: Upload native stdlib parity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-stdlib-parity-log
          path: native-stdlib-parity.log
          if-no-files-found: warn
