name: Feature request
description: Suggest a language, standard library, or tooling improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Requests with a concrete use case and a
        syntax sketch are easier to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What problem would this solve? Who would use it?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: "Sketch the syntax or API, and how it interacts with existing features."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "What did you try instead, and why was it not enough?"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "Which parts of the project would change: parser, analyzer, bytecode VM, LLVM backend, standard library, or docs?"
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: "I am willing to implement this myself"
          required: false
