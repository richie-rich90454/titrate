[package]
name = "trc"
version = "0.3.0-alpha"
edition = "2021"
description = "Titrate language compiler and interpreter"

[[bin]]
name = "trc"
path = "src/main.rs"

[lib]
name = "trc"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
crc32fast = "1.4"
base64 = "0.22"
percent-encoding = "2"
rand = "0.8"
flate2 = "1.0"
liblzma = { version = "=0.4.8", features = ["static"] }
lz4_flex = "=0.11.6"
twox-hash = "=2.1.4"
zstd = "=0.13.3"
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
memmap2 = "0.9"
libloading = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
native-tls = "0.2"
inkwell = { version = "0.9", default-features = false, features = ["llvm22-1-no-llvm-linking", "target-x86"] }
# Direct llvm-sys dep so we can enable `disable-alltargets-init`, which together
# with inkwell's `no-llvm-linking` makes the build script link LLVM-C.lib
# directly via build.rs instead of going through llvm-config.
llvm-sys = { version = "221", features = ["disable-alltargets-init"] }

[dev-dependencies]
inkwell = { version = "0.9", default-features = false, features = ["llvm22-1-no-llvm-linking", "target-x86"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["utilapiset", "winuser", "playsoundapi"] }
winreg = "0.55"
